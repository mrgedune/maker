<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit House maker</title>
<meta name="description" content="Build a 3D block game from parts, wire up machines, make creatures that fight, and play it with friends.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101318'/%3E%3Cpath d='M3 12h10M3 9h4v3M9 6h4v6' stroke='%23ff4d4f' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/maker.css">
</head>
<body>
<header class="top">
  <div class="brand">Rabbit House <b>maker</b></div>
  <div class="menu">
    <button id="file-button" aria-haspopup="true" aria-expanded="false" aria-controls="file-menu">File</button>
    <div class="menu-list" id="file-menu" hidden>
      <button data-file="new">New world…</button>
      <button data-file="examples">Examples…</button>
      <button data-file="tutorial">Tutorial</button>
      <button data-file="worlds">My worlds…</button>
      <hr>
      <button data-file="open">Open world file…</button>
      <button data-file="save">Save world file <span class="key">Ctrl+S</span></button>
    </div>
  </div>
  <label class="world-name"><span class="sr">World name</span><input id="world-name" maxlength="40" spellcheck="false"></label>
  <span id="saved" class="saved" title="Every change is kept in this browser. File, Save world file keeps a copy anywhere else.">Saved<span class="long"> in this browser</span></span>
  <nav class="tabs" role="tablist">
    <button role="tab" data-screen="build" aria-selected="true">Build</button>
    <button role="tab" data-screen="wiring">Wiring</button>
    <button role="tab" data-screen="characters">Characters</button>
    <button role="tab" data-screen="play">Play</button>
    <button role="tab" data-screen="together">Play together</button>
    <button role="tab" data-screen="ship">Ship</button>
  </nav>
  <div class="top-actions">
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>
</header>

<main>
  <section class="screen" id="screen-build" data-screen="build"></section>
  <section class="screen" id="screen-wiring" data-screen="wiring" hidden></section>
  <section class="screen" id="screen-characters" data-screen="characters" hidden></section>
  <section class="screen" id="screen-play" data-screen="play" hidden></section>
  <section class="screen" id="screen-together" data-screen="together" hidden></section>
  <section class="screen" id="screen-ship" data-screen="ship" hidden></section>
</main>

<dialog id="dialog"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="open-file" accept=".json,application/json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
